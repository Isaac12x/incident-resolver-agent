[project]
name = "incident-harness"
version = "0.1.0"
description = "A durable agent harness that turns production incidents into verified fixes"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.19,<0.20",
    "mcp[cli]>=1.26,<2",
    "a2a-sdk",
    "fastapi",
    "uvicorn",
    "textual",
    "httpx",
    "pygithub",
    "pydantic",
    "python-dotenv>=1,<2",
    "graphifyy",
    "code-review-graph",
    "fastmcp>=3.2,<4",
    "seed-cli",
]

[project.scripts]
incident-agent = "src.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "src/builtin_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
